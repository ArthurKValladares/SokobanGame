name: Required Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: 1.4.357.0
  VULKAN_SDK_SHA256: 0f09bf6a0625e346bf004be70b92907e934a4c76606b323441b2baf3a5a0e66d

concurrency:
  group: required-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            libasound2-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfribidi-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libibus-1.0-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libthai-dev \
            libudev-dev \
            liburing-dev \
            libusb-1.0-0-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-cursor-dev \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            ninja-build \
            pkg-config \
            wayland-protocols \
            xz-utils

      - name: Restore Vulkan SDK
        id: vulkan-sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/vulkan-sdk/${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-linux-x64-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.vulkan-sdk-cache.outputs.cache-hit != 'true'
        run: |
          archive="${RUNNER_TEMP}/vulkan-sdk.tar.xz"
          install_root="${RUNNER_TOOL_CACHE}/vulkan-sdk"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz"
          echo "${VULKAN_SDK_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${install_root}"
          tar -xf "${archive}" -C "${install_root}"

      - name: Expose Vulkan SDK
        run: |
          sdk="${RUNNER_TOOL_CACHE}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"
          test -x "${sdk}/bin/glslc"
          test -f "${sdk}/include/vulkan/vulkan.h"
          echo "VULKAN_SDK=${sdk}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${sdk}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
          echo "CMAKE_PREFIX_PATH=${sdk}:${sdk}/lib/VulkanLoader" >> "${GITHUB_ENV}"
          echo "${sdk}/bin" >> "${GITHUB_PATH}"

      - name: Configure ${{ matrix.configuration }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DSOKOBAN_BUILD_TESTS=ON

      - name: Build ${{ matrix.configuration }}
        run: cmake --build build --parallel

      - name: Test ${{ matrix.configuration }}
        run: >-
          ctest --test-dir build
          --build-config ${{ matrix.configuration }}
          --output-on-failure
          --no-tests=error
          --timeout 60
