name: Required Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: 1.4.357.0
  VULKAN_SDK_SHA256: 0f09bf6a0625e346bf004be70b92907e934a4c76606b323441b2baf3a5a0e66d

concurrency:
  group: required-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests (Debug)
            build_type: Debug
            cmake_options: -DSOKOBAN_BUILD_TESTS=ON
            build_target: all
            run_tests: true
            run_fuzz: false
          - name: Tests (Release)
            build_type: Release
            cmake_options: -DSOKOBAN_BUILD_TESTS=ON
            build_target: all
            run_tests: true
            run_fuzz: false
          - name: Sanitizers (ASan + UBSan)
            build_type: Debug
            cmake_options: -DSOKOBAN_BUILD_TESTS=ON -DSOKOBAN_ENABLE_SANITIZERS=ON
            build_target: all
            run_tests: true
            run_fuzz: false
            compiler_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          - name: Static analysis (clang-tidy)
            build_type: Debug
            cmake_options: -DSOKOBAN_BUILD_TESTS=OFF -DSOKOBAN_ENABLE_CLANG_TIDY=ON
            build_target: sokoban
            run_tests: false
            run_fuzz: false
            compiler_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          - name: Fuzzing (player profile)
            build_type: Debug
            cmake_options: -DSOKOBAN_BUILD_TESTS=OFF -DSOKOBAN_BUILD_FUZZ_TESTS=ON
            build_target: sokoban_player_profile_fuzz
            run_tests: false
            run_fuzz: true
            compiler_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            clang-tidy \
            libasound2-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfribidi-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libibus-1.0-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libthai-dev \
            libudev-dev \
            liburing-dev \
            libusb-1.0-0-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-cursor-dev \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            mesa-vulkan-drivers \
            ninja-build \
            pkg-config \
            vulkan-validationlayers \
            wayland-protocols \
            xvfb \
            xz-utils

      - name: Restore Vulkan SDK
        id: vulkan-sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/vulkan-sdk/${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-linux-x64-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.vulkan-sdk-cache.outputs.cache-hit != 'true'
        run: |
          archive="${RUNNER_TEMP}/vulkan-sdk.tar.xz"
          install_root="${RUNNER_TOOL_CACHE}/vulkan-sdk"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz"
          echo "${VULKAN_SDK_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${install_root}"
          tar -xf "${archive}" -C "${install_root}"

      - name: Expose Vulkan SDK
        run: |
          sdk="${RUNNER_TOOL_CACHE}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"
          test -x "${sdk}/bin/glslc"
          test -f "${sdk}/include/vulkan/vulkan.h"
          echo "VULKAN_SDK=${sdk}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${sdk}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
          echo "CMAKE_PREFIX_PATH=${sdk}:${sdk}/lib/VulkanLoader" >> "${GITHUB_ENV}"
          echo "${sdk}/bin" >> "${GITHUB_PATH}"

      - name: Configure ${{ matrix.name }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          ${{ matrix.compiler_options }}
          ${{ matrix.cmake_options }}

      - name: Build ${{ matrix.name }}
        run: cmake --build build --target ${{ matrix.build_target }} --parallel

      - name: Test ${{ matrix.name }}
        if: matrix.run_tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          xvfb-run --auto-servernum
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error --timeout 60

      - name: Fuzz player-profile decoding
        if: matrix.run_fuzz
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ./build/sokoban_player_profile_fuzz
          -max_len=65536 -max_total_time=60 -print_final_stats=1
