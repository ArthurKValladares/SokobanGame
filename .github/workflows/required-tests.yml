name: Required Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VULKAN_SDK_VERSION: 1.4.357.0
  # Both pins were checked against LunarG's published checksums, which live at
  #   https://sdk.lunarg.com/sdk/sha/<version>/<platform>/<file>.txt
  # On a version bump, re-pin from there rather than from whatever a CI run
  # happened to download - a hash taken from the download only proves the
  # download was self-consistent, not that it came from LunarG:
  #   curl -sS https://sdk.lunarg.com/sdk/sha/$VER/linux/vulkan_sdk.tar.xz.txt
  #   curl -sS https://sdk.lunarg.com/sdk/sha/$VER/windows/vulkan_sdk.exe.txt
  VULKAN_SDK_SHA256: 0f09bf6a0625e346bf004be70b92907e934a4c76606b323441b2baf3a5a0e66d
  VULKAN_SDK_WINDOWS_SHA256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d
  # Frames the headless render gate draws before exiting. Enough to cross the
  # asset-publication ramp (one asset publishes per frame) and reach a steady
  # state where every pass is recording real work.
  SMOKE_FRAMES: 240

concurrency:
  group: required-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests (Debug)
            build_type: Debug
            # Validation layers are compiled in only for Debug, so this is the
            # one configuration that can host the render gate below. The Vulkan
            # smoke test defaults to OFF and had never been switched on here,
            # which meant mesa-vulkan-drivers and vulkan-validationlayers were
            # installed for nothing.
            cmake_options: -DSOKOBAN_BUILD_TESTS=ON -DSOKOBAN_BUILD_VULKAN_SMOKE_TESTS=ON
            build_target: all
            run_tests: true
            run_fuzz: false
            run_smoke: true
          - name: Tests (Release)
            build_type: Release
            cmake_options: -DSOKOBAN_BUILD_TESTS=ON
            build_target: all
            run_tests: true
            run_fuzz: false
            run_smoke: false
          - name: Sanitizers (ASan + UBSan)
            build_type: Debug
            cmake_options: -DSOKOBAN_BUILD_TESTS=ON -DSOKOBAN_ENABLE_SANITIZERS=ON
            build_target: all
            run_tests: true
            run_fuzz: false
            run_smoke: false
            compiler_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          - name: Static analysis (clang-tidy)
            build_type: Debug
            cmake_options: -DSOKOBAN_BUILD_TESTS=OFF -DSOKOBAN_ENABLE_CLANG_TIDY=ON
            build_target: sokoban
            run_tests: false
            run_fuzz: false
            run_smoke: false
            compiler_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          - name: Fuzzing (player profile)
            build_type: Debug
            cmake_options: -DSOKOBAN_BUILD_TESTS=OFF -DSOKOBAN_BUILD_FUZZ_TESTS=ON
            build_target: sokoban_player_profile_fuzz
            run_tests: false
            run_fuzz: true
            run_smoke: false
            compiler_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            clang-tidy \
            libasound2-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfribidi-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libibus-1.0-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libthai-dev \
            libudev-dev \
            liburing-dev \
            libusb-1.0-0-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-cursor-dev \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            mesa-vulkan-drivers \
            ninja-build \
            pkg-config \
            vulkan-validationlayers \
            wayland-protocols \
            xvfb \
            xz-utils

      - name: Restore Vulkan SDK
        id: vulkan-sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/vulkan-sdk/${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-linux-x64-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.vulkan-sdk-cache.outputs.cache-hit != 'true'
        run: |
          archive="${RUNNER_TEMP}/vulkan-sdk.tar.xz"
          install_root="${RUNNER_TOOL_CACHE}/vulkan-sdk"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz"
          echo "${VULKAN_SDK_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${install_root}"
          tar -xf "${archive}" -C "${install_root}"

      - name: Expose Vulkan SDK
        run: |
          sdk="${RUNNER_TOOL_CACHE}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"
          test -x "${sdk}/bin/glslc"
          test -f "${sdk}/include/vulkan/vulkan.h"
          echo "VULKAN_SDK=${sdk}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${sdk}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
          echo "CMAKE_PREFIX_PATH=${sdk}:${sdk}/lib/VulkanLoader" >> "${GITHUB_ENV}"
          echo "${sdk}/bin" >> "${GITHUB_PATH}"

      - name: Configure ${{ matrix.name }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          ${{ matrix.compiler_options }}
          ${{ matrix.cmake_options }}

      - name: Build ${{ matrix.name }}
        run: cmake --build build --target ${{ matrix.build_target }} --parallel

      - name: Test ${{ matrix.name }}
        if: matrix.run_tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          xvfb-run --auto-servernum
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error --timeout 60

      - name: Fuzz player-profile decoding
        if: matrix.run_fuzz
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ./build/sokoban_player_profile_fuzz
          -max_len=65536 -max_total_time=60 -print_final_stats=1

      # The only step that exercises swapchain, pipelines, descriptors, the
      # shadow and SSAO passes and real draws. Everything above it either does
      # not link Vulkan or stops at device creation.
      - name: Render frames under validation
        if: matrix.run_smoke
        env:
          # Pin lavapipe explicitly. Left to its own devices the loader may
          # find another ICD on the runner image, and "which driver ran" is
          # something a render gate should state rather than discover.
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          set -euo pipefail
          test -f "${VK_DRIVER_FILES}" \
            || { echo "::error::lavapipe ICD manifest missing; is mesa-vulkan-drivers installed?"; exit 1; }

          # The SDK loader is first on LD_LIBRARY_PATH, so point it at the
          # SDK's own layer manifests rather than mixing in the apt package's.
          layer_dir="${VULKAN_SDK}/share/vulkan/explicit_layer.d"
          if [ ! -f "${layer_dir}/VkLayer_khronos_validation.json" ]; then
            layer_dir=/usr/share/vulkan/explicit_layer.d
          fi
          test -f "${layer_dir}/VkLayer_khronos_validation.json" \
            || { echo "::error::VK_LAYER_KHRONOS_validation manifest not found"; exit 1; }
          export VK_LAYER_PATH="${layer_dir}"
          echo "Using ICD ${VK_DRIVER_FILES} and layers ${VK_LAYER_PATH}"

          # A throwaway profile directory: a smoke run writes a checkpoint on
          # level load, and that must not land in the runner's real prefs.
          saves="${RUNNER_TEMP}/smoke-profile"
          mkdir -p "${saves}"

          # --require-validation makes a missing layer a failure rather than a
          # silent pass; the binary exits non-zero if validation reports
          # anything, so no log grepping is involved.
          xvfb-run --auto-servernum \
            ./build/sokoban \
              --smoke-frames "${SMOKE_FRAMES}" \
              --require-validation \
              --save-directory "${saves}"

  windows:
    name: Tests (MSVC ${{ matrix.build_type }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Restore Vulkan SDK
        id: vulkan-sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}\vulkan-sdk\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-windows-x64-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.vulkan-sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan_sdk.exe'
          $uri = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer -MaximumRetryCount 3

          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $expected = "$env:VULKAN_SDK_WINDOWS_SHA256".Trim().ToLower()
          if ([string]::IsNullOrEmpty($expected)) {
            Write-Host "::error::VULKAN_SDK_WINDOWS_SHA256 is unset. Pin it from https://sdk.lunarg.com/sdk/sha/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe.txt (this download hashed to $actual)"
            exit 1
          }
          if ($actual -ne $expected) {
            Write-Host "::error::Vulkan SDK checksum mismatch. Expected $expected, downloaded $actual"
            exit 1
          }

          $root = Join-Path $env:RUNNER_TOOL_CACHE "vulkan-sdk\$env:VULKAN_SDK_VERSION"
          & $installer --root $root --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installer exited $LASTEXITCODE" }

      - name: Expose Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TOOL_CACHE "vulkan-sdk\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path (Join-Path $sdk 'Bin\glslc.exe'))) {
            throw "glslc.exe missing under $sdk"
          }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Join-Path $sdk 'Bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DSOKOBAN_BUILD_TESTS=ON
          -DSOKOBAN_BUILD_VULKAN_SMOKE_TESTS=OFF

      - name: Build ${{ matrix.build_type }}
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # The Vulkan device path is deliberately not built here: hosted Windows
      # runners ship no Vulkan ICD, so vulkan_smoke could only ever fail for
      # reasons that say nothing about this change. That path is covered by the
      # lavapipe render gate in the Linux job; what this job is for is proving
      # the code compiles and behaves under the compiler that actually ships.
      - name: Test ${{ matrix.build_type }}
        run: >-
          ctest --test-dir build
          --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error --timeout 120
